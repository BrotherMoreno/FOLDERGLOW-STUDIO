name: Build Windows

on:
  push:
    tags: ['v*']          # al subir un tag (ej. v2.5.3) compila y publica un Release
  workflow_dispatch:       # o a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FolderGlow-Studio
          path: |
            dist/*.exe
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
